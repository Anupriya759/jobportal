<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - CareerNest</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-body">

<header>

    <nav class="navbar">

        <div class="logo">
            Career<span>Nest</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="jobs.html">Jobs</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <a href="register.html"
                   class="register-btn active">
                   Register
                </a>
            </li>

        </ul>

    </nav>

</header>


<section class="auth-section">

    <div class="auth-card register-card">

        <h1>Create Account</h1>

        <p>Start your career journey with CareerNest.</p>


        <form id="registerForm">

            <label>Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >


            <label>Skills</label>

            <input
                type="text"
                id="skills"
                placeholder="Example: Java, SQL, HTML"
                required
            >


            <button
                type="submit"
                class="auth-btn">
                Create Account
            </button>

        </form>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
