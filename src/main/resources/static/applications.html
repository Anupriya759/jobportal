<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications - CareerNest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            Career<span>Nest</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="jobs.html">Jobs</a></li>
            <li><a href="applications.html" class="active">Applications</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html" class="register-btn">Register</a></li>
        </ul>

    </nav>
</header>

<section class="jobs-section">

    <div class="page-heading">

        <p class="small-title">APPLICATIONS</p>

        <h1>Job Applications</h1>

        <p>
            View applications submitted through CareerNest.
        </p>

    </div>

    <div id="applicationsContainer" class="job-container">

        <p>Loading applications...</p>

    </div>

</section>

<footer>

    <div class="footer-content">
        <h2>CareerNest</h2>
        <p>Your first step towards a successful career.</p>
    </div>

    <p class="copyright">
        © 2026 CareerNest. All Rights Reserved.
    </p>

</footer>

<script>

async function loadApplications() {

    try {

        const response = await fetch("/api/applications");

        if (!response.ok) {
            throw new Error("Failed to load applications");
        }

        const applications = await response.json();

        const container =
            document.getElementById("applicationsContainer");

        if (applications.length === 0) {

            container.innerHTML =
                "<p>No applications found.</p>";

            return;
        }

        container.innerHTML = "";

        applications.forEach(application => {

            const card = document.createElement("div");

            card.className = "job-card";

            card.innerHTML = `
                <div class="company-logo">
                    CN
                </div>

                <div class="job-info">

                    <h2>${application.jobTitle}</h2>

                    <h3>${application.applicantName}</h3>

                    <p>📧 ${application.email}</p>

                    <p>💼 Job ID: ${application.jobId}</p>

                    <p>
    📌 Status:
    <strong>${application.status || "Applied"}</strong>
</p>

                </div>
            `;

            container.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("applicationsContainer").innerHTML =
            "<p>Unable to load applications.</p>";
    }
}

loadApplications();

</script>

</body>
</html>
